<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ app_name }} — Personal AI Twin Network{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">{{ app_name }}</a>
      <input class="nav-toggle" type="checkbox" id="nav-toggle" aria-label="Toggle navigation" />
      <label class="nav-button" for="nav-toggle" aria-hidden="true">Menu</label>
      <nav class="site-nav" aria-label="Site">
        {% set cur = request.url.path %}
        {% if me %}
        <a href="/post" class="{% if cur.startswith('/post') %}active{% endif %}">Post Something</a>
        <a href="/find" class="{% if cur.startswith('/find') %}active{% endif %}">Find Something</a>
        <a href="/conversations" class="{% if cur.startswith('/conversations') %}active{% endif %}">My Conversation</a>
        <a href="/notifications" class="{% if cur.startswith('/notifications') %}active{% endif %}">Notification</a>
        <a href="/dashboard" class="{% if cur.startswith('/dashboard') %}active{% endif %}">Twins</a>
        <a class="user-chip {% if cur in ('/me',) or cur.startswith('/twin') or cur.startswith('/memories') or cur.startswith('/usage') %}active{% endif %}" href="/me">{{ me.name }}</a>
        {% else %}
        <a href="/register" class="{% if cur == '/register' %}active{% endif %}">Create account</a>
        <a href="/login" class="{% if cur == '/login' %}active{% endif %}">Log in</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>{{ app_name }} · Personal AI twin network · Humans stay in control.</p>
    </div>
  </footer>
</body>
</html>
